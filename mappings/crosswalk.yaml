# Internal control objective -> framework control IDs, plus a catalog of the
# control IDs used, with short paraphrased titles (no standard text is reproduced).
#
# SOX-ITGC IDs are AuditForge labels for the common ITGC domains (program
# change, access to programs and data); SOX itself does not number controls.

objectives:
  CHG-REVIEW:
    title: Code changes are reviewed and approved before they reach a protected branch
    controls:
      SOC2: [CC8.1]
      ISO27001:2022: [A.8.32]
      NIST-800-53r5: [CM-3]
      SOX-ITGC: [ITGC-PC]

  CHG-SOD:
    title: The approver of a change is independent of its author
    controls:
      # A.8.4 covers who may change source code; AC-5 is separation of duties.
      ISO27001:2022: [A.8.4]
      NIST-800-53r5: [AC-5]
      SOX-ITGC: [ITGC-PC]

  CODE-INTEGRITY:
    title: Committed code is attributable to a verified identity and protected from tampering
    controls:
      SOC2: [CC8.1]
      ISO27001:2022: [A.8.4, A.8.28]
      NIST-800-53r5: [SI-7]
      SOX-ITGC: [ITGC-PC]

  CHG-TEST:
    title: Changes pass automated testing before they are merged
    controls:
      # CC8.1 and A.8.32 include testing changes before implementation; A.8.29 is
      # security testing in development; CM-3 covers testing changes and SA-11 is
      # developer testing.
      SOC2: [CC8.1]
      ISO27001:2022: [A.8.29, A.8.32]
      NIST-800-53r5: [CM-3, SA-11]
      SOX-ITGC: [ITGC-PC]

  PRIV-BYPASS:
    title: Privileged users cannot bypass change controls
    controls:
      # CC6.1 / A.8.2 cover restricting privileged access; CM-5 restricts who
      # can make changes; AC-5 because a bypassing admin defeats separation of duties.
      SOC2: [CC6.1, CC8.1]
      ISO27001:2022: [A.8.2, A.8.32]
      NIST-800-53r5: [AC-5, CM-5]
      SOX-ITGC: [ITGC-PC, ITGC-APD]

  # --- Infrastructure configuration (IaC scans) -----------------------------
  DATA-ENCRYPTION:
    title: Data is encrypted at rest and in transit with managed keys
    controls:
      # CC6.1/CC6.7 cover protecting and transmitting data; A.8.24 is cryptography;
      # SC-28 is protection at rest and SC-8 protection in transit.
      SOC2: [CC6.1, CC6.7]
      ISO27001:2022: [A.8.24]
      NIST-800-53r5: [SC-8, SC-28]

  NETWORK-EXPOSURE:
    title: Systems are not exposed to networks beyond what they need
    controls:
      # CC6.6 is protection at the system boundary; A.8.20/A.8.22 network security and
      # segregation; SC-7 boundary protection.
      SOC2: [CC6.6]
      ISO27001:2022: [A.8.20, A.8.22]
      NIST-800-53r5: [SC-7]

  LOGGING-MONITORING:
    title: Security-relevant activity is logged and the logs are protected
    controls:
      SOC2: [CC7.2]
      ISO27001:2022: [A.8.15, A.8.16]
      NIST-800-53r5: [AU-2, AU-12]

  BACKUP-RESILIENCE:
    title: Data and systems can be recovered after loss or deletion
    controls:
      # CC7.5 is recovery from incidents; A.8.13 backup; A.8.14 redundancy; CP-9 backup.
      SOC2: [CC7.5]
      ISO27001:2022: [A.8.13, A.8.14]
      NIST-800-53r5: [CP-9]

  LEAST-PRIVILEGE:
    title: Identities and workloads run with the least privilege they need
    controls:
      SOC2: [CC6.3]
      ISO27001:2022: [A.5.15, A.8.2]
      NIST-800-53r5: [AC-6]

  SECURE-CONFIG:
    title: Systems are built from a secure, documented configuration baseline
    controls:
      # The fallback for scanner rules that fit none of the families above.
      SOC2: [CC7.1]
      ISO27001:2022: [A.8.9]
      NIST-800-53r5: [CM-2, CM-6]
      SOX-ITGC: [ITGC-CO]

frameworks:
  # Catalog of control IDs with short paraphrased titles (no standard text is
  # reproduced). SOC 2 lists the Common Criteria; ISO 27001:2022 lists all 93
  # Annex A controls; NIST 800-53 lists only the controls AuditForge maps;
  # SOX-ITGC lists the four common ITGC domains. Controls with no automated check
  # still matter: the gap report expects manual attestations for them.
  SOC2:
    CC1.1: Commitment to integrity and ethical values
    CC1.2: Board independence and oversight of internal control
    CC1.3: Management sets structures, reporting lines and authority
    CC1.4: Attracts, develops and retains competent people
    CC1.5: Holds individuals accountable for control responsibilities
    CC2.1: Uses relevant, quality information to support controls
    CC2.2: Communicates control objectives and responsibilities internally
    CC2.3: Communicates with external parties on control matters
    CC3.1: Objectives defined clearly enough to identify risks
    CC3.2: Identifies and analyses risks to objectives
    CC3.3: Considers the potential for fraud
    CC3.4: Identifies and assesses changes that affect controls
    CC4.1: Ongoing or separate evaluations of controls
    CC4.2: Evaluates and communicates control deficiencies
    CC5.1: Selects and develops control activities that reduce risk
    CC5.2: Selects and develops general controls over technology
    CC5.3: Deploys controls through policies and procedures
    CC6.1: Logical access security over protected information assets
    CC6.2: Registers and authorises users before granting access
    CC6.3: Grants, changes and removes access by role and least privilege
    CC6.4: Restricts physical access to facilities and assets
    CC6.5: Protects data when assets are disposed of
    CC6.6: Protects against threats from outside the system boundary
    CC6.7: Restricts transmission, movement and removal of information
    CC6.8: Prevents or detects unauthorised or malicious software
    CC7.1: Detects configuration changes and new vulnerabilities
    CC7.2: Monitors system components for anomalies
    CC7.3: Evaluates security events to decide whether they are incidents
    CC7.4: Responds to security incidents
    CC7.5: Recovers from security incidents
    CC8.1: Changes are authorized, designed, tested, approved and implemented
    CC9.1: Mitigates risk from business disruption
    CC9.2: Manages risk from vendors and business partners
