# Check -> internal control objective(s).
#
# A check tests one technical setting. An objective is the control intent that
# setting supports. Framework control IDs live only in crosswalk.yaml, so a
# framework update never requires touching check code.

checks:
  GH-BP-01:
    title: Changes require a pull request
    objectives: [CHG-REVIEW]
    # Blocking direct pushes forces every change through a reviewable PR, which
    # is the point where authorization and approval can be evidenced.

  GH-BP-02:
    title: Minimum approving reviews before merge
    objectives: [CHG-REVIEW, CHG-SOD]
    # A required approval is the approval step itself, and because GitHub does
    # not let authors approve their own PR it also gives author/approver separation.

  GH-BP-03:
    title: Stale approvals dismissed on new commits
    objectives: [CHG-REVIEW]
    # Without dismissal, code pushed after approval merges unreviewed, so the
    # approval no longer covers what was deployed.

  GH-BP-04:
    title: Signed commits required
    objectives: [CODE-INTEGRITY]
    # Signatures bind each commit to a verified identity and detect tampering
    # with commit contents; this is integrity, not approval.

  GH-BP-05:
    title: Protection enforced for administrators
    objectives: [PRIV-BYPASS]
    # If admins can bypass the rules, every control above has an undocumented
    # exception held by privileged users.

  # Change management integrity (Module A). GH-BP-* tests how the branch is
  # configured (design); GH-CM-* tests every change that actually merged in the
  # audit period (operating effectiveness), which is what a SOX/SOC 2 auditor samples.

  GH-CM-01:
    title: Every merged change independently approved
    objectives: [CHG-REVIEW, CHG-SOD]
    # An approval on the merged commit by someone other than the author is both
    # the approval evidence and the author/approver separation, per change.

  GH-CM-02:
    title: Every merged change passed CI
    objectives: [CHG-TEST]
    # Passing automated checks on the exact commit that merged is the testing
    # evidence for that change.

  GH-CM-03:
    title: No changes reached the branch outside a pull request
    objectives: [CHG-REVIEW, PRIV-BYPASS]
    # A commit on the branch with no merged PR skipped review entirely. On a
    # protected branch only a privileged user or a bypass-list actor can do that.

  # Change management from a local git clone (no API). Same control intent as
  # GH-CM-*, but git only records what landed and who committed it, so approval
  # and CI (GIT-CM-01/02) are always MANUAL_REVIEW with the population to check.

  GIT-CM-01:
    title: Every merged change independently approved (local clone)
    objectives: [CHG-REVIEW, CHG-SOD]
    # Same objectives as GH-CM-01; git cannot evidence them, so the finding hands
    # the reviewer the full population of landed changes to check in GitHub.

  GIT-CM-02:
    title: Every merged change passed CI (local clone)
    objectives: [CHG-TEST]
    # Same objective as GH-CM-02; CI results are not stored in git.

  GIT-CM-03:
    title: No changes reached the branch outside a pull request (local clone)
    objectives: [CHG-REVIEW, PRIV-BYPASS]
    # A landed commit not created and signed by GitHub's merge was pushed directly,
    # skipping review; on a protected branch that takes a privileged bypass.

  # Infrastructure-as-code scans (imported Checkov JSON or SARIF). Each IAC-*
  # check groups scanner rules by control family; mappings/iac_rules.yaml decides
  # which family a scanner rule belongs to.

  IAC-ENC:
    title: Infrastructure encrypts data at rest and in transit
    objectives: [DATA-ENCRYPTION]

  IAC-NET:
    title: Infrastructure is not exposed beyond what it needs
    objectives: [NETWORK-EXPOSURE]

  IAC-LOG:
    title: Infrastructure logs security-relevant activity
    objectives: [LOGGING-MONITORING]

  IAC-BAK:
    title: Infrastructure data can be recovered
    objectives: [BACKUP-RESILIENCE]

  IAC-PRIV:
    title: Infrastructure grants least privilege
    objectives: [LEAST-PRIVILEGE]

  IAC-CFG:
    title: Infrastructure follows the secure configuration baseline
    objectives: [SECURE-CONFIG]
